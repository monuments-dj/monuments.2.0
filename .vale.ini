; Vale config - the deterministic floor of the copy system (docs/COPY-SYSTEM-PLAN.md).
; Runs on BUILT dist HTML (never .astro source - frontmatter/JSX lints as garbage).
; Invoke via: node tools/copycheck.mjs   (part of the pre-ship battery)
StylesPath = tools/vale-styles
MinAlertLevel = warning

[*.html]
BasedOnStyles = Monuments
